name: E2E

# Runs this action (uses: ./) against the real Specwise API through each marketplace: one diff and one validate
# request per marketplace.
# RapidAPI needs the repository secret RAPIDAPI_KEY, API.market needs API_MARKET_KEY; a missing one skips its job.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 1 * *"   # monthly: 2 requests per marketplace, so it fits each free plan (15 a month)

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.market }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: rapidapi
            secret: RAPIDAPI_KEY
          - market: api.market
            secret: API_MARKET_KEY
    env:
      HAS_KEY: ${{ secrets[matrix.secret] != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: No key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::${{ matrix.secret }} is not set; skipping the ${{ matrix.market }} end-to-end test."
      - name: Two local commits, base and revision of the fixture spec
        if: env.HAS_KEY == 'true'
        id: commits
        run: |
          git config user.name e2e && git config user.email e2e@localhost
          mkdir -p e2e && cp tests/fixtures/base.yaml e2e/openapi.yaml
          git add e2e && git commit -qm base && echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cp tests/fixtures/revision.yaml e2e/openapi.yaml && git commit -qam revision
      - name: Check the spec with the action
        if: env.HAS_KEY == 'true'
        id: check
        continue-on-error: true   # the fixture revision has breaking changes on purpose
        uses: ./
        with:
          rapidapi-key: ${{ matrix.market == 'rapidapi' && secrets.RAPIDAPI_KEY || '' }}
          api-market-key: ${{ matrix.market == 'api.market' && secrets.API_MARKET_KEY || '' }}
          spec-paths: e2e/openapi.yaml
          base-ref: ${{ steps.commits.outputs.base }}
          validate: "true"
          comment: "false"
          max-requests: "2"
      - name: Check the outputs
        if: env.HAS_KEY == 'true'
        env:
          PASSED: ${{ steps.check.outputs.passed }}
          BREAKING: ${{ steps.check.outputs.breaking-changes }}
          SEMVER: ${{ steps.check.outputs.semver }}
          REQUESTS: ${{ steps.check.outputs.requests-used }}
          QUOTA: ${{ steps.check.outputs.quota-remaining }}
          OUTCOME: ${{ steps.check.outcome }}
          MARKET: ${{ matrix.market }}
        run: |
          echo "passed=$PASSED breaking=$BREAKING semver=$SEMVER requests=$REQUESTS quota=$QUOTA outcome=$OUTCOME"
          test "$OUTCOME" = failure    # the breaking changes must fail the step
          test "$PASSED" = false
          test "$BREAKING" = 3
          test "$SEMVER" = major
          test "$REQUESTS" = 2
          if [ "$MARKET" = rapidapi ]; then test -n "$QUOTA"; fi   # RapidAPI's quota header came through
